# Publica en CurseForge y en GitHub Releases al subir una etiqueta (p. ej. v3.3.1).
# Requiere el secreto CF_API_KEY y "## X-Curse-Project-ID: <número>" en KnuUI.toc.
# Sin CF_API_KEY el empaquetador omite CurseForge y sólo arma el release de GitHub.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
