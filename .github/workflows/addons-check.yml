# Una vez por semana revisa si salieron versiones nuevas de los addons que KnuUI viste o soporta
# (lista en .github/addons-check.json) y abre o actualiza un issue con lo que cambió.
# También se puede correr a mano desde Actions > Addons check > Run workflow.
name: Addons check

on:
  schedule:
    - cron: "0 12 * * 1" # lunes 12:00 UTC (09:00 en Buenos Aires)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: check
        run: python3 .github/scripts/check_addons.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_CORE_API_KEY: ${{ secrets.CF_CORE_API_KEY }}
      - name: Abrir o actualizar el issue
        if: steps.check.outputs.changed != '0' || steps.check.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Addons actualizados: revisar skins"
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file addons-report.md
          else
            gh issue create --title "$title" --body-file addons-report.md
          fi
